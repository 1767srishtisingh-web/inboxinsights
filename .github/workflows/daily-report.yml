# Runs Inbox Insights every day on GitHub's free cloud computers.
# Your laptop does NOT need to be on.
name: Daily Inbox Insights

on:
  schedule:
    # Time is in UTC. 11:30 UTC = 5:00 PM India time (IST).
    # GitHub may start it 5-30 minutes late on busy days. That is normal.
    - cron: "30 11 * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can run it any time

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata          # so "today's emails" means today in India
      INBOX_HEADLESS: "1"       # cloud has no browser: never try to open a Google login page
    steps:
      - name: Get the project code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Recreate secret files from GitHub Secrets
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
          GMAIL_TOKENS_B64: ${{ secrets.GMAIL_TOKENS_B64 }}
        run: |
          printf '%s\n' "$APP_ENV" > .env
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          mkdir -p users
          printf '%s' "$USERS_JSON" > users/users.json
          printf '%s' "$GMAIL_TOKENS_B64" | base64 -d | tar -xzf -
          echo "Token files restored:"; ls tokens

      - name: Run Inbox Insights
        run: python main.py

      - name: Save PDF reports (download from the run page for 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-reports
          path: |
            output/*.pdf
            logs/application.log
          retention-days: 7
          if-no-files-found: ignore
